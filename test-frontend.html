<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram WebApp Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .user-info {
            text-align: left;
            background: var(--tg-theme-bg-color, #ffffff);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Telegram WebApp Test</h1>
        
        <div class="card">
            <h2>Bot Status</h2>
            <div id="status" class="status info">Initializing...</div>
        </div>

        <div class="card">
            <h2>User Information</h2>
            <div id="userInfo" class="user-info">
                <p><strong>Loading user data...</strong></p>
            </div>
        </div>

        <div class="card">
            <h2>Test Features</h2>
            <button class="btn" onclick="testHaptic()">Test Haptic Feedback</button>
            <button class="btn" onclick="testTheme()">Toggle Theme</button>
            <button class="btn" onclick="showAlert()">Show Alert</button>
            <button class="btn" onclick="expandApp()">Expand App</button>
        </div>

        <div class="card">
            <h2>Currency Converter</h2>
            <div id="currencyInfo">
                <p>Loading exchange rates...</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        let tg = window.Telegram.WebApp;
        
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function updateUserInfo() {
            const userInfoEl = document.getElementById('userInfo');
            
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                userInfoEl.innerHTML = `
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><strong>Name:</strong> ${user.first_name} ${user.last_name || ''}</p>
                    <p><strong>Username:</strong> @${user.username || 'Not set'}</p>
                    <p><strong>Language:</strong> ${user.language_code || 'Not set'}</p>
                    <p><strong>Premium:</strong> ${user.is_premium ? 'Yes' : 'No'}</p>
                `;
                updateStatus('✅ Telegram WebApp is working!', 'success');
            } else {
                userInfoEl.innerHTML = '<p><strong>Not running in Telegram WebApp</strong></p>';
                updateStatus('⚠️ Not running in Telegram WebApp', 'error');
            }
        }

        function testHaptic() {
            tg.HapticFeedback.impactOccurred('medium');
            updateStatus('Haptic feedback triggered!', 'success');
        }

        function testTheme() {
            const currentTheme = tg.colorScheme;
            updateStatus(`Current theme: ${currentTheme}`, 'info');
        }

        function showAlert() {
            tg.showAlert('Hello from Telegram WebApp!');
        }

        function expandApp() {
            tg.expand();
            updateStatus('App expanded!', 'success');
        }

        async function loadCurrencyRates() {
            try {
                const response = await fetch('https://cbu.uz/en/arkhiv-kursov-valyut/json/');
                const data = await response.json();
                
                const currencyEl = document.getElementById('currencyInfo');
                currencyEl.innerHTML = `
                    <p><strong>USD:</strong> ${data[0]?.Rate || 'N/A'} UZS</p>
                    <p><strong>EUR:</strong> ${data[1]?.Rate || 'N/A'} UZS</p>
                    <p><strong>RUB:</strong> ${data[2]?.Rate || 'N/A'} UZS</p>
                `;
            } catch (error) {
                document.getElementById('currencyInfo').innerHTML = '<p>Failed to load currency rates</p>';
            }
        }

        // Initialize the app
        tg.ready();
        tg.expand();
        
        updateUserInfo();
        loadCurrencyRates();

        // Set up theme
        document.body.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
        document.body.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
        document.body.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#2481cc');
        document.body.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
        document.body.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f1f1f1');
    </script>
</body>
</html>
